[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-calculators"
version = "0.1.0"
description = "Standardised clinical calculators as a Python package, CLI, and API"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "eatyourpeas" }
]
license = { file = "LICENSE" }
keywords = ["clinical", "calculators", "health", "fastapi", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=1.10,<2.0",
  "fastapi>=0.103",
  "uvicorn>=0.22",
  "markdown>=3.4",
  "python-multipart>=0.0.20",
  "slowapi>=0.1.9",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21.0",
  "mypy>=1.0",
  "sphinx>=7.0",
  "black>=24.0",
  "isort>=5.13",
  "ruff>=0.1.0",
  "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/eatyourpeas/clinical-calculators"

[project.scripts]
clinical-calculators = "cli.main:main"
calc = "cli.main:main"

[tool.setuptools]
packages = [
  "calculators",
  "core",
  "cli",
  "api",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "C901",  # function too complex (allow complex functions where needed)
]

[tool.ruff.lint.per-file-ignores]

[tool.pytest.ini_options]
testpaths = ["tests", "core/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async",
]
# Don't fail on import errors in optional test dependencies
addopts = "--tb=short -v"
"__init__.py" = ["F401"]

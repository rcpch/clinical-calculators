# Workflow to create pull requests for calculator submissions
name: Create Calculator PR

on:
  workflow_dispatch:
    inputs:
      calculator_name:
        description: "Calculator name (snake_case)"
        required: true
        type: string
      calculator_code:
        description: "Python calculator code"
        required: true
        type: string
      test_code:
        description: "Python test code"
        required: true
        type: string
      spec:
        description: "TOML specification"
        required: true
        type: string
      description:
        description: "Calculator description"
        required: true
        type: string
      submitter_github:
        description: "GitHub username of submitter"
        required: false
        type: string
      submitter_name:
        description: "Name of submitter"
        required: false
        type: string
      submitter_affiliation:
        description: "Affiliation of submitter"
        required: false
        type: string

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: live
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Create branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Delete remote branch if it exists
          git push origin --delete calculator/${{ inputs.calculator_name }} || true
          git checkout -b calculator/${{ inputs.calculator_name }}

      - name: Write calculator file
        run: |
          cat > calculators/${{ inputs.calculator_name }}.py << 'EOFCALC'
          ${{ inputs.calculator_code }}
          EOFCALC

      - name: Write test file
        run: |
          cat > tests/test_${{ inputs.calculator_name }}.py << 'EOFTEST'
          ${{ inputs.test_code }}
          EOFTEST

      - name: Run tests
        id: test
        run: |
          pytest tests/test_${{ inputs.calculator_name }}.py -v > test_results.txt 2>&1 || true
          echo "test_output<<EOF" >> $GITHUB_OUTPUT
          cat test_results.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit files
        run: |
          git add calculators/${{ inputs.calculator_name }}.py tests/test_${{ inputs.calculator_name }}.py
          git commit -m "Add ${{ inputs.calculator_name }} calculator" \
            -m "Generated via calculator generator tool" \
            -m "Description: ${{ inputs.description }}"

      - name: Push branch
        run: |
          git push origin calculator/${{ inputs.calculator_name }}

      - name: Build PR body
        id: pr_body
        run: |
          cat >> $GITHUB_OUTPUT << 'EOFPR'
          body<<EOFBODY
          ## New Calculator: ${{ inputs.description }}

          ### Files Added
          - `calculators/${{ inputs.calculator_name }}.py`
          - `tests/test_${{ inputs.calculator_name }}.py`

          ### Specification
          ```toml
          ${{ inputs.spec }}
          ```

          ### Test Results
          ```
          ${{ steps.test.outputs.test_output }}
          ```

          ### Submitted By
          ${{ inputs.submitter_github && format('GitHub: @{0}', inputs.submitter_github) || inputs.submitter_name && format('Name: {0}', inputs.submitter_name) || 'Anonymous' }}
          ${{ inputs.submitter_affiliation && format('Affiliation: {0}', inputs.submitter_affiliation) || '' }}

          ---
          *Generated automatically via the [Calculator Generator](https://api.rcpch.ac.uk/clinical-calculators/generator.html)*
          EOFBODY
          EOFPR

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ steps.pr_body.outputs.body }}
        run: |
          gh pr create \
            --base live \
            --head calculator/${{ inputs.calculator_name }} \
            --title "Add ${{ inputs.calculator_name }} calculator" \
            --body "$PR_BODY" || true

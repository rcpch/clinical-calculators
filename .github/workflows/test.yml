name: Run Tests

on:
  pull_request:
    branches:
      - live
  push:
    branches:
      - live

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting checks
        run: |
          echo "Running Black..."
          black --check calculators core cli api tests
          echo "Running isort..."
          isort --check-only calculators core cli api tests
          echo "Running Ruff..."
          ruff check calculators core cli api tests

      - name: Run tests with pytest
        run: |
          pytest -v --tb=short

      - name: Test summary
        if: always()
        run: |
          echo "Test run completed"

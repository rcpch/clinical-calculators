<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation - RCPCH Clinical Calculators</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  
  <!-- DaisyUI 5 + Tailwind CSS 4 -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
  
  <style>
    /* DaisyUI Theme Override */
    [data-theme="light"] {
      --p: 199 89% 51%;     /* primary: #11A7F2 */
      --pc: 0 0% 100%;      /* primary-content: white */
      --s: 215 59% 50%;     /* secondary: #3366CC */
      --sc: 0 0% 100%;      /* secondary-content: white */
      --a: 90 60% 50%;      /* accent: #66CC33 */
      --ac: 0 0% 100%;      /* accent-content: white */
      --n: 240 73% 20%;     /* neutral: #0D0D58 */
      --nc: 0 0% 100%;      /* neutral-content: white */
      --b1: 0 0% 100%;      /* base-100: white */
      --b2: 0 0% 96%;       /* base-200: light gray */
      --b3: 0 0% 92%;       /* base-300: gray */
      --bc: 240 10% 20%;    /* base-content: dark gray text */
    }
    
    body {
      background: white;
      color: #333;
    }
    
    /* Documentation content styling */
    #doc-content {
      line-height: 1.75;
    }
    
    #doc-content h1 {
      font-size: 2.5rem;
      font-weight: bold;
      color: #0D0D58;
      margin-top: 2rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid #11A7F2;
      padding-bottom: 0.5rem;
    }
    
    #doc-content h2 {
      font-size: 2rem;
      font-weight: bold;
      color: #0D0D58;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }
    
    #doc-content h3 {
      font-size: 1.5rem;
      font-weight: bold;
      color: #3366CC;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    
    #doc-content p {
      margin-bottom: 1rem;
    }
    
    #doc-content ul, #doc-content ol {
      margin-left: 2rem;
      margin-bottom: 1rem;
    }
    
    #doc-content li {
      margin-bottom: 0.5rem;
    }
    
    #doc-content a {
      color: #11A7F2;
      text-decoration: underline;
    }
    
    #doc-content a:hover {
      color: #0D0D58;
    }
    
    #doc-content code {
      background: #f3f4f6;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-size: 0.875em;
      font-family: 'Courier New', monospace;
    }
    
    #doc-content pre {
      background: #f3f4f6;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    
    #doc-content pre code {
      background: none;
      padding: 0;
    }
    
    #doc-content blockquote {
      border-left: 4px solid #11A7F2;
      padding-left: 1rem;
      margin-left: 0;
      margin-bottom: 1rem;
      color: #666;
    }
    
    .menu-link {
      cursor: pointer;
    }
    
    .menu-link:hover {
      background-color: #f0f9ff;
    }
    
    .menu-link.active {
      background-color: #e0f2fe;
      font-weight: bold;
    }
  </style>
</head>
<body>
  
  <!-- Header -->
  <div class="navbar bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm py-4">
    <div class="container mx-auto">
      <button class="btn btn-ghost normal-case text-xl font-bold text-rcpch-dark-blue flex items-center gap-2" onclick="window.location.href='index.html'">
        <img src="./favicon.ico" alt="RCPCH Logo" class="w-8 h-8 flex-shrink-0">
        <span>RCPCH Clinical Calculators</span>
      </button>
      <div class="ml-auto">
        <a href="index.html" class="btn btn-ghost btn-sm">Back to Calculators</a>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      
      <!-- Sidebar Menu -->
      <aside class="lg:col-span-1">
        <div class="card bg-base-100 border border-gray-200">
          <div class="card-body p-4">
            <h2 class="text-lg font-bold text-rcpch-dark-blue mb-4">Documentation</h2>
            <ul class="menu menu-compact w-full" id="doc-menu">
              <li><span class="loading loading-spinner loading-sm"></span></li>
            </ul>
          </div>
        </div>
      </aside>
      
      <!-- Content Area -->
      <main class="lg:col-span-3">
        <div class="card bg-base-100 border border-gray-200">
          <div class="card-body p-8">
            <div id="doc-content">
              <div class="flex justify-center p-8">
                <span class="loading loading-spinner loading-lg text-primary"></span>
              </div>
            </div>
          </div>
        </div>
      </main>
      
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer p-10 bg-white border-t border-gray-200 text-gray-700 mt-12">
    <div class="container mx-auto">
      <div class="flex flex-wrap items-center gap-6">
        <div>
          <p>Royal College of Paediatrics and Child Health</p>
          <p class="text-sm">Copyright © 2025 - All rights reserved</p>
        </div>
        <div class="flex flex-wrap items-center gap-4">
          <a href="https://www.rcpch.ac.uk" target="_blank" class="link link-hover">About RCPCH</a>
          <a href="https://github.com/rcpch/clinical-calculators" target="_blank" class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
            GitHub
          </a>
          <a href="https://github.com/rcpch/clinical-calculators/issues" target="_blank" class="link link-hover">Report an Issue</a>
        </div>
      </div>
    </div>
  </footer>

  <script type="module">
    // Documentation index structure
    const docsIndex = [
      { title: 'Overview', file: 'index.md', id: 'index' },
      { title: 'Project Overview', file: 'overview.md', id: 'overview' },
      { title: 'Development Guide', file: 'development.md', id: 'development' },
      { title: 'API Reference', file: 'api-reference.md', id: 'api-reference' },
      { title: 'Calculator Specifications', file: 'calculator-specs.md', id: 'calculator-specs' },
      { title: 'RCPCH Brand Colors', file: 'colors.md', id: 'colors' },
    ];

    let currentDoc = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderMenu();
      loadDoc('index');
    });

    // Render menu
    function renderMenu() {
      const menu = document.getElementById('doc-menu');
      menu.innerHTML = docsIndex.map(doc => `
        <li>
          <a class="menu-link" data-doc="${doc.id}" onclick="loadDoc('${doc.id}')">
            ${doc.title}
          </a>
        </li>
      `).join('');
    }

    // Load and render document
    window.loadDoc = async (docId) => {
      const doc = docsIndex.find(d => d.id === docId);
      if (!doc) return;

      currentDoc = docId;
      
      // Update active menu item
      document.querySelectorAll('.menu-link').forEach(link => {
        link.classList.toggle('active', link.dataset.doc === docId);
      });

      const content = document.getElementById('doc-content');
      content.innerHTML = '<div class="flex justify-center p-8"><span class="loading loading-spinner loading-lg text-primary"></span></div>';

      try {
        const response = await fetch(`../docs/${doc.file}`);
        if (!response.ok) throw new Error('Failed to load documentation');
        
        const markdown = await response.text();
        const html = marked.parse(markdown);
        content.innerHTML = html;

        // Make internal doc links work
        content.querySelectorAll('a').forEach(link => {
          const href = link.getAttribute('href');
          if (href && href.endsWith('.md')) {
            const docId = docsIndex.find(d => d.file === href)?.id;
            if (docId) {
              link.onclick = (e) => {
                e.preventDefault();
                loadDoc(docId);
              };
            }
          }
        });

        // Scroll to top
        window.scrollTo(0, 0);
      } catch (error) {
        content.innerHTML = '<div class="alert alert-error">Failed to load documentation</div>';
        console.error(error);
      }
    };
  </script>

</body>
</html>

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: clinical-calculators:built
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER:-rcpch}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME:-clinical-calculators}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
    command:
      [
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
